<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการ - Ripley's Pattaya</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Prompt', sans-serif; background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 50%, #0a0a1a 100%); color: #fff; min-height: 100vh; padding: 2rem 1rem; }
        
        #loginScreen { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-box { max-width: 400px; width: 100%; background: rgba(26,26,46,0.95); padding: 3rem; border-radius: 24px; text-align: center; border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
        .login-box h2 { color: #ffd700; margin-bottom: 1.5rem; font-size: 1.8rem; }
        .login-box h2 i { margin-right: 10px; }
        .login-box input { width: 100%; padding: 1rem; margin-bottom: 1rem; background: rgba(10,10,26,0.8); border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 12px; font-size: 1rem; font-family: 'Prompt', sans-serif; }
        .login-box input:focus { outline: none; border-color: #ffd700; }
        .login-box button { width: 100%; padding: 1rem; background: linear-gradient(135deg, #e31e24, #ff6b6b); color: #fff; border: none; border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 1.05rem; font-family: 'Prompt', sans-serif; }
        .login-box .hint { margin-top: 1rem; font-size: 0.85rem; color: rgba(255,255,255,0.6); }
        .login-box .hint code { color: #ffd700; background: rgba(255,215,0,0.1); padding: 0.2rem 0.5rem; border-radius: 5px; }
        
        #adminPanel { display: none; }
        .admin-container { max-width: 900px; margin: 0 auto; background: rgba(26,26,46,0.95); border-radius: 24px; padding: 2.5rem; border: 1px solid rgba(255,255,255,0.15); }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid rgba(255,255,255,0.15); }
        .admin-header h2 { color: #ffd700; font-size: 1.8rem; }
        .admin-close { background: linear-gradient(135deg, #e31e24, #ff6b6b); color: #fff; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; }
        
        .admin-tabs { display: flex; gap: 0.5rem; margin-bottom: 2rem; border-bottom: 1px solid rgba(255,255,255,0.15); padding-bottom: 1rem; flex-wrap: wrap; }
        .admin-tab { background: transparent; color: rgba(255,255,255,0.7); border: none; padding: 0.7rem 1.2rem; cursor: pointer; font-size: 1rem; border-radius: 10px; font-family: 'Prompt', sans-serif; }
        .admin-tab.active { background: linear-gradient(135deg, #e31e24, #ff6b6b); color: #fff; }
        
        .admin-section { display: none; }
        .admin-section.active { display: block; }
        
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.6rem; color: #ffd700; font-weight: 600; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 0.9rem 1rem; background: rgba(10,10,26,0.8); border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 12px; font-family: 'Prompt', sans-serif; font-size: 1rem; }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: #ffd700; }
        .form-group textarea { min-height: 120px; resize: vertical; }
        
        .btn-save { background: linear-gradient(135deg, #e31e24, #ff6b6b); color: #fff; border: none; padding: 1rem 2.5rem; border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 1.05rem; font-family: 'Prompt', sans-serif; margin-top: 1rem; }
        .image-list, .video-list { display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem; }
        .list-item { background: rgba(10,10,26,0.6); padding: 1rem; border-radius: 12px; display: flex; gap: 0.8rem; align-items: center; border: 1px solid rgba(255,255,255,0.15); }
        .list-item input { flex: 1; background: rgba(5,5,16,0.8); }
        .btn-delete { background: #ff4444; color: #fff; border: none; padding: 0.6rem 1.2rem; border-radius: 8px; cursor: pointer; font-family: 'Prompt', sans-serif; }
        .btn-add { background: #4CAF50; color: #fff; border: none; padding: 0.7rem 1.5rem; border-radius: 10px; cursor: pointer; font-weight: 600; margin-bottom: 1rem; font-family: 'Prompt', sans-serif; }
        
        .export-import { display: flex; gap: 1rem; margin-top: 2rem; flex-wrap: wrap; }
        .export-import button { flex: 1; min-width: 200px; padding: 1rem; border-radius: 12px; border: none; cursor: pointer; font-weight: 600; font-family: 'Prompt', sans-serif; }
        .btn-export { background: #2196F3; color: #fff; }
        .btn-import { background: #FF9800; color: #fff; }
        .btn-apply { background: #9C27B0; color: #fff; }
        
        .success-msg { background: #4CAF50; padding: 1rem; border-radius: 12px; margin-bottom: 1rem; display: none; text-align: center; font-weight: 600; }
        .info-box { background: rgba(33,150,243,0.15); border-left: 4px solid #2196F3; padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; font-size: 0.9rem; line-height: 1.6; }
    </style>
</head>
<body>
    <!-- หน้า Login -->
    <div id="loginScreen">
        <div class="login-box">
            <h2><i class="fas fa-lock"></i> เข้าสู่ระบบแอดมิน</h2>
            <input type="password" id="adminPass" placeholder="กรอกรหัสผ่าน">
            <button onclick="doLogin()">เข้าสู่ระบบ</button>
            <p class="hint">รหัสผ่าน: <code>ripley2024</code></p>
        </div>
    </div>

    <!-- หน้า Admin Panel -->
    <div id="adminPanel">
        <div class="admin-container">
            <div class="admin-header">
                <h2><i class="fas fa-cog"></i> ระบบจัดการ</h2>
                <button class="admin-close" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>
            </div>

            <div id="successMsg" class="success-msg">✅ บันทึกสำเร็จ!</div>

            <div class="info-box">
                <strong>📌 วิธีใช้งาน:</strong><br>
                1. แก้ไขข้อมูลในหน้านี้<br>
                2. กดปุ่ม <strong>"บันทึก"</strong> (ข้อมูลจะบันทึกในเบราว์เซอร์)<br>
                3. กดปุ่ม <strong>"Export JSON"</strong> เพื่อดาวน์โหลดไฟล์ data.json<br>
                4. อัพโหลดไฟล์ data.json ใหม่ขึ้น GitHub หรือ Cloudflare
            </div>

            <div class="admin-tabs">
                <button class="admin-tab active" onclick="showTab('content', event)">📝 เนื้อหา</button>
                <button class="admin-tab" onclick="showTab('images', event)">🖼️ รูปภาพ</button>
                <button class="admin-tab" onclick="showTab('videos', event)"> วิดีโอ</button>
            </div>

            <!-- แท็บเนื้อหา -->
            <div class="admin-section active" id="tab-content">
                <div class="form-group">
                    <label>🎢 เลือกเครื่องเล่น</label>
                    <select id="selectAttraction" onchange="loadContent()">
                        <option value="">-- เลือกเครื่องเล่น --</option>
                    </select>
                </div>
                <div class="form-group"><label>📌 ชื่อ (ภาษาไทย)</label><input type="text" id="titleTh"></div>
                <div class="form-group"><label>📌 ชื่อ (ภาษาอังกฤษ)</label><input type="text" id="titleEn"></div>
                <div class="form-group"><label>🏷️ คำบรรยายสั้น (ไทย)</label><input type="text" id="subtitleTh"></div>
                <div class="form-group"><label>🏷️ คำบรรยายสั้น (อังกฤษ)</label><input type="text" id="subtitleEn"></div>
                <div class="form-group"><label>📄 รายละเอียด (ไทย)</label><textarea id="descTh"></textarea></div>
                <div class="form-group"><label>📄 รายละเอียด (อังกฤษ)</label><textarea id="descEn"></textarea></div>
                <div class="form-group"><label>🖼️ รูปหลัก (URL)</label><input type="text" id="heroImage"></div>
                <div class="form-group"><label>📍 ลิงก์แผนที่</label><input type="text" id="mapUrl"></div>
                <button class="btn-save" onclick="saveContent()">💾 บันทึกเนื้อหา</button>
            </div>

            <!-- แท็บรูปภาพ -->
            <div class="admin-section" id="tab-images">
                <div class="form-group">
                    <label>🎢 เลือกเครื่องเล่น</label>
                    <select id="selectAttractionImg" onchange="loadImages()">
                        <option value="">-- เลือกเครื่องเล่น --</option>
                    </select>
                </div>
                <button class="btn-add" onclick="addImage()">➕ เพิ่มรูปภาพ</button>
                <div id="imageList" class="image-list"></div>
                <button class="btn-save" onclick="saveImages()">💾 บันทึกรูปภาพ</button>
            </div>

            <!-- แท็บวิดีโอ -->
            <div class="admin-section" id="tab-videos">
                <div class="form-group">
                    <label>🎢 เลือกเครื่องเล่น</label>
                    <select id="selectAttractionVid" onchange="loadVideos()">
                        <option value="">-- เลือกเครื่องเล่น --</option>
                    </select>
                </div>
                <button class="btn-add" onclick="addVideo()">➕ เพิ่มวิดีโอ</button>
                <div id="videoList" class="video-list"></div>
                <button class="btn-save" onclick="saveVideos()">💾 บันทึกวิดีโอ</button>
            </div>

            <div class="export-import">
                <button class="btn-export" onclick="exportJSON()">📤 Export JSON</button>
                <button class="btn-import" onclick="document.getElementById('importFile').click()"> Import JSON</button>
                <button class="btn-apply" onclick="applyToSite()">✨ ใช้ข้อมูลทันที</button>
                <input type="file" id="importFile" style="display:none" accept=".json" onchange="importJSON(event)">
            </div>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = 'ripley2024';
        let attractions = [];
        let currentIndex = -1;

        // เช็คว่า login แล้วหรือยัง
        window.onload = function() {
            if (sessionStorage.getItem('adminLoggedIn') === 'true') {
                showAdminPanel();
            }
        };

        function doLogin() {
            const pass = document.getElementById('adminPass').value;
            if (pass === ADMIN_PASSWORD) {
                sessionStorage.setItem('adminLoggedIn', 'true');
                showAdminPanel();
            } else {
                alert('❌ รหัสผ่านไม่ถูกต้อง!');
                document.getElementById('adminPass').value = '';
            }
        }

        function showAdminPanel() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            loadData();
        }

        function logout() {
            if (confirm('ต้องการออกจากระบบ?')) {
                sessionStorage.removeItem('adminLoggedIn');
                location.reload();
            }
        }

        async function loadData() {
            const saved = localStorage.getItem('ripleyAttractions');
            if (saved) {
                try { attractions = JSON.parse(saved); } catch(e) { await loadFromJson(); }
            } else {
                await loadFromJson();
            }
            populateSelects();
        }

        async function loadFromJson() {
            try {
                const response = await fetch('data.json');
                if (response.ok) attractions = await response.json();
            } catch(e) { attractions = []; }
        }

        function populateSelects() {
            ['selectAttraction', 'selectAttractionImg', 'selectAttractionVid'].forEach(id => {
                const select = document.getElementById(id);
                select.innerHTML = '<option value="">-- เลือกเครื่องเล่น --</option>';
                attractions.forEach((a, i) => {
                    const option = document.createElement('option');
                    option.value = i;
                    option.textContent = a.title?.th || a.title?.en || `เครื่องเล่น ${i+1}`;
                    select.appendChild(option);
                });
            });
        }

        function showTab(tab, event) {
            document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.admin-section').forEach(s => s.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('tab-' + tab).classList.add('active');
        }

        function loadContent() {
            const index = document.getElementById('selectAttraction').value;
            if (index === '') return;
            currentIndex = parseInt(index);
            const a = attractions[currentIndex];
            document.getElementById('titleTh').value = a.title?.th || '';
            document.getElementById('titleEn').value = a.title?.en || '';
            document.getElementById('subtitleTh').value = a.subtitle?.th || '';
            document.getElementById('subtitleEn').value = a.subtitle?.en || '';
            document.getElementById('descTh').value = a.desc?.th || '';
            document.getElementById('descEn').value = a.desc?.en || '';
            document.getElementById('heroImage').value = a.heroImage || '';
            document.getElementById('mapUrl').value = a.mapUrl || '';
        }

        function saveContent() {
            if (currentIndex === -1) { alert('กรุณาเลือกเครื่องเล่น'); return; }
            const a = attractions[currentIndex];
            a.title = a.title || {};
            a.subtitle = a.subtitle || {};
            a.desc = a.desc || {};
            a.title.th = document.getElementById('titleTh').value;
            a.title.en = document.getElementById('titleEn').value;
            a.subtitle.th = document.getElementById('subtitleTh').value;
            a.subtitle.en = document.getElementById('subtitleEn').value;
            a.desc.th = document.getElementById('descTh').value;
            a.desc.en = document.getElementById('descEn').value;
            a.heroImage = document.getElementById('heroImage').value;
            a.mapUrl = document.getElementById('mapUrl').value;
            saveToLocalStorage();
            showSuccess('บันทึกเนื้อหาสำเร็จ!');
            populateSelects();
        }

        function loadImages() {
            const index = document.getElementById('selectAttractionImg').value;
            if (index === '') return;
            currentIndex = parseInt(index);
            const list = document.getElementById('imageList');
            list.innerHTML = '';
            if (!attractions[currentIndex].images) attractions[currentIndex].images = [];
            attractions[currentIndex].images.forEach((img, i) => {
                const row = document.createElement('div');
                row.className = 'list-item';
                row.innerHTML = `<input type="text" value="${img}"><button class="btn-delete" onclick="deleteImage(${i})">ลบ</button>`;
                list.appendChild(row);
            });
        }

        function addImage() {
            const list = document.getElementById('imageList');
            const row = document.createElement('div');
            row.className = 'list-item';
            row.innerHTML = `<input type="text" placeholder="URL รูปภาพ"><button class="btn-delete" onclick="this.parentElement.remove()">ลบ</button>`;
            list.appendChild(row);
        }

        function deleteImage(index) {
            attractions[currentIndex].images.splice(index, 1);
            loadImages();
        }

        function saveImages() {
            if (currentIndex === -1) { alert('กรุณาเลือกเครื่องเล่น'); return; }
            const inputs = document.querySelectorAll('#imageList input');
            attractions[currentIndex].images = [];
            inputs.forEach(input => { if (input.value.trim()) attractions[currentIndex].images.push(input.value.trim()); });
            saveToLocalStorage();
            showSuccess('บันทึกรูปภาพสำเร็จ!');
        }

        function loadVideos() {
            const index = document.getElementById('selectAttractionVid').value;
            if (index === '') return;
            currentIndex = parseInt(index);
            const list = document.getElementById('videoList');
            list.innerHTML = '';
            if (!attractions[currentIndex].videos) attractions[currentIndex].videos = [];
            attractions[currentIndex].videos.forEach((v, i) => {
                const row = document.createElement('div');
                row.className = 'list-item';
                row.innerHTML = `<input type="text" value="${v.url || ''}" placeholder="URL วิดีโอ"><input type="text" value="${v.title?.th || ''}" placeholder="ชื่อวิดีโอ"><button class="btn-delete" onclick="deleteVideo(${i})">ลบ</button>`;
                list.appendChild(row);
            });
        }

        function addVideo() {
            const list = document.getElementById('videoList');
            const row = document.createElement('div');
            row.className = 'list-item';
            row.innerHTML = `<input type="text" placeholder="URL วิดีโอ"><input type="text" placeholder="ชื่อวิดีโอ"><button class="btn-delete" onclick="this.parentElement.remove()">ลบ</button>`;
            list.appendChild(row);
        }

        function deleteVideo(index) {
            attractions[currentIndex].videos.splice(index, 1);
            loadVideos();
        }

        function saveVideos() {
            if (currentIndex === -1) { alert('กรุณาเลือกเครื่องเล่น'); return; }
            const rows = document.querySelectorAll('#videoList .list-item');
            attractions[currentIndex].videos = [];
            rows.forEach(row => {
                const inputs = row.querySelectorAll('input');
                const url = inputs[0].value.trim();
                const title = inputs[1].value.trim();
                if (url) attractions[currentIndex].videos.push({ url, title: { th: title, en: title } });
            });
            saveToLocalStorage();
            showSuccess('บันทึกวิดีโอสำเร็จ!');
        }

        function saveToLocalStorage() {
            localStorage.setItem('ripleyAttractions', JSON.stringify(attractions));
        }

        function showSuccess(msg) {
            const el = document.getElementById('successMsg');
            el.textContent = '✅ ' + msg;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 3000);
        }

        function exportJSON() {
            const blob = new Blob([JSON.stringify(attractions, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'data.json';
            a.click();
            URL.revokeObjectURL(url);
            showSuccess('ดาวน์โหลดไฟล์ data.json สำเร็จ!');
        }

        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (Array.isArray(data)) {
                        attractions = data;
                        saveToLocalStorage();
                        populateSelects();
                        showSuccess('นำเข้าข้อมูลสำเร็จ!');
                    } else { alert('ไฟล์ไม่ถูกต้อง'); }
                } catch(err) { alert('ไฟล์ JSON ไม่ถูกต้อง: ' + err.message); }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function applyToSite() {
            saveToLocalStorage();
            alert('✅ ข้อมูลถูกบันทึกแล้ว!\n\nกด OK เพื่อเปิดหน้าหลักดูผลลัพธ์');
            window.open('index.html', '_blank');
        }

        document.getElementById('adminPass').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') doLogin();
        });
    </script>
</body>
</html>
