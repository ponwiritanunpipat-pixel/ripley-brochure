<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการ - Ripley's Pattaya</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #e31e24;
            --accent: #ffd700;
            --dark: #0a0a1a;
            --card-bg: rgba(255,255,255,0.05);
            --glass: rgba(255,255,255,0.1);
            --glass-border: rgba(255,255,255,0.15);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Prompt', sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 50%, #0a0a1a 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .admin-container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(26,26,46,0.95);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--primary);
        }
        .admin-header h1 {
            color: var(--accent);
            font-size: 1.8rem;
        }
        .close-btn {
            background: var(--primary);
            color: #fff;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .close-btn:hover {
            transform: rotate(90deg);
            background: #ff6b6b;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 15px;
        }
        .tab {
            background: transparent;
            color: rgba(255,255,255,0.7);
            border: none;
            padding: 12px 20px;
            cursor: pointer;
            font-size: 1rem;
            border-radius: 10px;
            transition: all 0.3s;
            font-weight: 600;
        }
        .tab:hover {
            background: var(--glass);
            color: #fff;
        }
        .tab.active {
            background: var(--primary);
            color: #fff;
        }
        .form-section {
            display: none;
        }
        .form-section.active {
            display: block;
            animation: fadeIn 0.4s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--accent);
            font-weight: 600;
            font-size: 0.95rem;
        }
        .form-group select,
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            background: rgba(10,10,26,0.8);
            border: 1px solid var(--glass-border);
            color: #fff;
            border-radius: 10px;
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.3s;
        }
        .form-group select:focus,
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(255,215,0,0.1);
        }
        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }
        .btn-save {
            background: linear-gradient(135deg, #e31e24, #ff6b6b);
            color: #fff;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1.05rem;
            transition: all 0.3s;
            box-shadow: 0 6px 20px rgba(227,30,36,0.3);
        }
        .btn-save:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(227,30,36,0.5);
        }
        .btn-add {
            background: linear-gradient(135deg, #4CAF50, #2e7d32);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            margin-bottom: 15px;
            transition: all 0.3s;
        }
        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76,175,80,0.4);
        }
        .btn-delete {
            background: linear-gradient(135deg, #ff4444, #cc0000);
            color: #fff;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-delete:hover {
            transform: scale(1.05);
        }
        .item-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }
        .item-row {
            background: rgba(10,10,26,0.6);
            padding: 12px;
            border-radius: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
            border: 1px solid var(--glass-border);
        }
        .item-row input {
            flex: 1;
            background: rgba(5,5,16,0.8);
            border: 1px solid var(--glass-border);
            color: #fff;
            padding: 10px;
            border-radius: 8px;
        }
        .success-msg {
            background: #4CAF50;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
            font-weight: 600;
        }
        .info-box {
            background: rgba(33,150,243,0.15);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #2196F3;
        }
        .info-box h3 {
            color: var(--accent);
            margin-bottom: 10px;
        }
        .info-box ol {
            margin-left: 20px;
            line-height: 1.8;
        }
        .export-import {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--glass-border);
        }
        .btn-export {
            flex: 1;
            background: linear-gradient(135deg, #2196F3, #1565c0);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-export:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(33,150,243,0.4);
        }
        .btn-import {
            flex: 1;
            background: linear-gradient(135deg, #FF9800, #e65100);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-import:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255,152,0,0.4);
        }
        @media (max-width: 768px) {
            .admin-container { padding: 15px; }
            .tabs { flex-wrap: wrap; }
            .tab { padding: 10px 15px; font-size: 0.9rem; }
            .export-import { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1><i class="fas fa-cog"></i> ระบบจัดการ</h1>
            <button class="close-btn" onclick="window.location.href='index.html'">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div class="info-box">
            <h3><i class="fas fa-info-circle"></i> วิธีใช้งาน</h3>
            <ol>
                <li>เลือกเครื่องเล่นที่ต้องการแก้ไข</li>
                <li>แก้ไขข้อมูลในฟอร์ม</li>
                <li>กดปุ่ม "บันทึก" เพื่อดาวน์โหลดไฟล์ data.json</li>
                <li>อัพโหลดไฟล์ data.json ใหม่ขึ้น GitHub หรือ Cloudflare</li>
                <li>รอ 30 วินาที เว็บจะอัพเดทอัตโนมัติ</li>
            </ol>
        </div>

        <div id="successMsg" class="success-msg">
            <i class="fas fa-check-circle"></i> บันทึกสำเร็จ! กรุณาอัพโหลดไฟล์ data.json ใหม่
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('content')">
                <i class="fas fa-edit"></i> เนื้อหา
            </button>
            <button class="tab" onclick="switchTab('images')">
                <i class="fas fa-images"></i> รูปภาพ
            </button>
            <button class="tab" onclick="switchTab('videos')">
                <i class="fas fa-video"></i> วิดีโอ
            </button>
        </div>

        <!-- Content Tab -->
        <div id="tab-content" class="form-section active">
            <div class="form-group">
                <label><i class="fas fa-gamepad"></i> เลือกเครื่องเล่น</label>
                <select id="selectAttraction" onchange="loadAttractionData()">
                    <option value="">-- เลือกเครื่องเล่น --</option>
                </select>
            </div>
            <div class="form-group">
                <label>📌 ชื่อ (ภาษาไทย)</label>
                <input type="text" id="titleTh" placeholder="ชื่อเครื่องเล่นภาษาไทย">
            </div>
            <div class="form-group">
                <label>📌 ชื่อ (ภาษาอังกฤษ)</label>
                <input type="text" id="titleEn" placeholder="ชื่อเครื่องเล่นภาษาอังกฤษ">
            </div>
            <div class="form-group">
                <label>🏷️ คำบรรยายสั้น (ไทย)</label>
                <input type="text" id="subtitleTh" placeholder="คำบรรยายสั้น">
            </div>
            <div class="form-group">
                <label>🏷️ คำบรรยายสั้น (อังกฤษ)</label>
                <input type="text" id="subtitleEn" placeholder="Short subtitle">
            </div>
            <div class="form-group">
                <label>📄 รายละเอียด (ไทย)</label>
                <textarea id="descTh" placeholder="รายละเอียดเครื่องเล่น"></textarea>
            </div>
            <div class="form-group">
                <label>📄 รายละเอียด (อังกฤษ)</label>
                <textarea id="descEn" placeholder="Description in English"></textarea>
            </div>
            <div class="form-group">
                <label>🖼️ รูปหลัก (URL)</label>
                <input type="text" id="heroImage" placeholder="https://example.com/image.jpg">
            </div>
            <div class="form-group">
                <label>📍 ลิงก์แผนที่ (Google Maps)</label>
                <input type="text" id="mapUrl" placeholder="https://maps.app.goo.gl/...">
            </div>
            <button class="btn-save" onclick="saveContent()">
                <i class="fas fa-save"></i> บันทึกเนื้อหา
            </button>
        </div>

        <!-- Images Tab -->
        <div id="tab-images" class="form-section">
            <div class="form-group">
                <label><i class="fas fa-gamepad"></i> เลือกเครื่องเล่น</label>
                <select id="selectAttractionImg" onchange="loadImages()">
                    <option value="">-- เลือกเครื่องเล่น --</option>
                </select>
            </div>
            <button class="btn-add" onclick="addImage()">
                <i class="fas fa-plus"></i> เพิ่มรูปภาพ
            </button>
            <div id="imageList" class="item-list"></div>
            <button class="btn-save" onclick="saveImages()">
                <i class="fas fa-save"></i> บันทึกรูปภาพ
            </button>
        </div>

        <!-- Videos Tab -->
        <div id="tab-videos" class="form-section">
            <div class="form-group">
                <label><i class="fas fa-gamepad"></i> เลือกเครื่องเล่น</label>
                <select id="selectAttractionVid" onchange="loadVideos()">
                    <option value="">-- เลือกเครื่องเล่น --</option>
                </select>
            </div>
            <button class="btn-add" onclick="addVideo()">
                <i class="fas fa-plus"></i> เพิ่มวิดีโอ
            </button>
            <div id="videoList" class="item-list"></div>
            <button class="btn-save" onclick="saveVideos()">
                <i class="fas fa-save"></i> บันทึกวิดีโอ
            </button>
        </div>

        <!-- Export/Import -->
        <div class="export-import">
            <button class="btn-export" onclick="exportJSON()">
                <i class="fas fa-download"></i> Export JSON (สำรองข้อมูล)
            </button>
            <button class="btn-import" onclick="document.getElementById('importFile').click()">
                <i class="fas fa-upload"></i> Import JSON (นำเข้าข้อมูล)
            </button>
            <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(event)">
        </div>
    </div>

    <script>
        let attractions = [];
        let currentIndex = -1;

        async function loadData() {
            try {
                const response = await fetch('data.json');
                attractions = await response.json();
                populateSelects();
            } catch (e) {
                alert('ไม่สามารถโหลดข้อมูลได้ กรุณาตรวจสอบไฟล์ data.json');
            }
        }

        function populateSelects() {
            const selects = ['selectAttraction', 'selectAttractionImg', 'selectAttractionVid'];
            selects.forEach(id => {
                const select = document.getElementById(id);
                select.innerHTML = '<option value="">-- เลือกเครื่องเล่น --</option>';
                attractions.forEach((a, i) => {
                    const option = document.createElement('option');
                    option.value = i;
                    option.textContent = a.title.th || a.title.en || `เครื่องเล่น ${i+1}`;
                    select.appendChild(option);
                });
            });
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('tab-' + tab).classList.add('active');
        }

        function loadAttractionData() {
            const index = document.getElementById('selectAttraction').value;
            if (index === '') return;
            currentIndex = parseInt(index);
            const a = attractions[currentIndex];
            document.getElementById('titleTh').value = a.title.th || '';
            document.getElementById('titleEn').value = a.title.en || '';
            document.getElementById('subtitleTh').value = a.subtitle?.th || '';
            document.getElementById('subtitleEn').value = a.subtitle?.en || '';
            document.getElementById('descTh').value = a.desc.th || '';
            document.getElementById('descEn').value = a.desc.en || '';
            document.getElementById('heroImage').value = a.heroImage || '';
            document.getElementById('mapUrl').value = a.mapUrl || '';
        }

        function saveContent() {
            if (currentIndex === -1) {
                alert('กรุณาเลือกเครื่องเล่น');
                return;
            }
            const a = attractions[currentIndex];
            a.title.th = document.getElementById('titleTh').value;
            a.title.en = document.getElementById('titleEn').value;
            a.subtitle.th = document.getElementById('subtitleTh').value;
            a.subtitle.en = document.getElementById('subtitleEn').value;
            a.desc.th = document.getElementById('descTh').value;
            a.desc.en = document.getElementById('descEn').value;
            a.heroImage = document.getElementById('heroImage').value;
            a.mapUrl = document.getElementById('mapUrl').value;
            showSuccess();
            downloadJSON();
            populateSelects();
        }

        function loadImages() {
            const index = document.getElementById('selectAttractionImg').value;
            if (index === '') return;
            currentIndex = parseInt(index);
            const list = document.getElementById('imageList');
            list.innerHTML = '';
            attractions[currentIndex].images.forEach((img, i) => {
                const row = document.createElement('div');
                row.className = 'item-row';
                row.innerHTML = `
                    <input type="text" value="${img}" data-index="${i}">
                    <button class="btn-delete" onclick="deleteImage(${i})">
                        <i class="fas fa-trash"></i> ลบ
                    </button>
                `;
                list.appendChild(row);
            });
        }

        function addImage() {
            const list = document.getElementById('imageList');
            const row = document.createElement('div');
            row.className = 'item-row';
            row.innerHTML = `
                <input type="text" placeholder="URL รูปภาพ" class="new-img">
                <button class="btn-delete" onclick="this.parentElement.remove()">
                    <i class="fas fa-trash"></i> ลบ
                </button>
            `;
            list.appendChild(row);
        }

        function deleteImage(index) {
            attractions[currentIndex].images.splice(index, 1);
            loadImages();
        }

        function saveImages() {
            if (currentIndex === -1) {
                alert('กรุณาเลือกเครื่องเล่น');
                return;
            }
            const inputs = document.querySelectorAll('#imageList input');
            const newImages = [];
            inputs.forEach(input => {
                if (input.value.trim()) newImages.push(input.value.trim());
            });
            attractions[currentIndex].images = newImages;
            showSuccess();
            downloadJSON();
        }

        function loadVideos() {
            const index = document.getElementById('selectAttractionVid').value;
            if (index === '') return;
            currentIndex = parseInt(index);
            const list = document.getElementById('videoList');
            list.innerHTML = '';
            attractions[currentIndex].videos.forEach((v, i) => {
                const row = document.createElement('div');
                row.className = 'item-row';
                row.innerHTML = `
                    <input type="text" value="${v.url}" placeholder="URL วิดีโอ" class="vid-url">
                    <input type="text" value="${v.title.th || ''}" placeholder="ชื่อวิดีโอ" class="vid-title">
                    <button class="btn-delete" onclick="deleteVideo(${i})">
                        <i class="fas fa-trash"></i> ลบ
                    </button>
                `;
                list.appendChild(row);
            });
        }

        function addVideo() {
            const list = document.getElementById('videoList');
            const row = document.createElement('div');
            row.className = 'item-row';
            row.innerHTML = `
                <input type="text" placeholder="URL วิดีโอ (YouTube embed)" class="vid-url">
                <input type="text" placeholder="ชื่อวิดีโอ" class="vid-title">
                <button class="btn-delete" onclick="this.parentElement.remove()">
                    <i class="fas fa-trash"></i> ลบ
                </button>
            `;
            list.appendChild(row);
        }

        function deleteVideo(index) {
            attractions[currentIndex].videos.splice(index, 1);
            loadVideos();
        }

        function saveVideos() {
            if (currentIndex === -1) {
                alert('กรุณาเลือกเครื่องเล่น');
                return;
            }
            const rows = document.querySelectorAll('#videoList .item-row');
            const newVideos = [];
            rows.forEach(row => {
                const url = row.querySelector('.vid-url').value.trim();
                const title = row.querySelector('.vid-title').value.trim();
                if (url) {
                    newVideos.push({ url, title: { th: title, en: title } });
                }
            });
            attractions[currentIndex].videos = newVideos;
            showSuccess();
            downloadJSON();
        }

        function showSuccess() {
            const msg = document.getElementById('successMsg');
            msg.style.display = 'block';
            setTimeout(() => msg.style.display = 'none', 3000);
        }

        function downloadJSON() {
            const blob = new Blob([JSON.stringify(attractions, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'data.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        function exportJSON() {
            downloadJSON();
        }

        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    attractions = JSON.parse(e.target.result);
                    populateSelects();
                    alert('นำเข้าข้อมูลสำเร็จ!');
                } catch (err) {
                    alert('ไฟล์ไม่ถูกต้อง: ' + err.message);
                }
            };
            reader.readAsText(file);
        }

        loadData();
    </script>
</body>
</html>
